name: Validação do protótipo
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r backend/requirements.txt
      - run: ruff check backend scripts
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure public Docker Hub cache
        run: |
          sudo python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('/etc/docker/daemon.json')
          config = json.loads(path.read_text()) if path.exists() else {}
          config['registry-mirrors'] = ['https://mirror.gcr.io']
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(config))
          PY
          sudo systemctl restart docker
      - run: docker compose up -d --build --wait
      - run: docker compose exec -T app python - --base http://127.0.0.1:8000 --output /tmp/evidence < scripts/evidence.py
      - if: always()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down
