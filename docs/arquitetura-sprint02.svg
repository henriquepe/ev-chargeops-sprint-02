<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">Arquitetura implementada do EV ChargeOps</title><desc id="desc">React interage com FastAPI, validação e detector de anomalias controlam elegibilidade, PostgreSQL registra sessões, auditoria e faturas. Previsão usa histórico validado. Integração física GoodWe futura.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#54846c"/></marker><style>text{font-family:Arial,sans-serif;fill:#214739}.title{font-size:29px;font-weight:bold}.h{font-size:18px;font-weight:bold}.p{font-size:13px;fill:#648371}.card{fill:white;stroke:#d4e4d5;stroke-width:1.5}.line{fill:none;stroke:#54846c;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="1200" height="660" fill="#f5f8f3"/><text class="p" x="40" y="35">GOODWE + FIAP · SPRINT 02</text><text class="title" x="40" y="80">Da sessão à fatura, com revisão e rastreabilidade.</text><rect class="card" x="40" y="135" width="240" height="110" rx="12"/><text class="h" x="60" y="170">React + Vite</text><text class="p" x="60" y="200">Gestor · morador · demonstrativo</text><text class="p" x="60" y="221">Filtros, revisão e exportação CSV</text><rect class="card" x="345" y="135" width="250" height="110" rx="12"/><text class="h" x="367" y="170">FastAPI</text><text class="p" x="367" y="200">Autenticação e autorização</text><text class="p" x="367" y="221">Contrato JSON · idempotência</text><path class="line" d="M280 190H345"/><rect class="card" x="40" y="320" width="240" height="110" rx="12"/><text class="h" x="60" y="355">Simulador</text><text class="p" x="60" y="385">Dados sintéticos reproduzíveis</text><text class="p" x="60" y="406">Seis cenários · sessões encerradas</text><path class="line" d="M280 375H313V221H345"/><rect class="card" x="660" y="135" width="230" height="110" rx="12"/><text class="h" x="680" y="170">Validação + detector</text><text class="p" x="680" y="200">Identidade, medição e potência</text><text class="p" x="680" y="221">Mediana/MAD → elegibilidade</text><path class="line" d="M595 190H660"/><rect x="950" y="135" width="210" height="110" rx="12" fill="#fff4da" stroke="#e2d3a8"/><text class="h" x="970" y="170">Revisão humana</text><text class="p" x="970" y="200">Liberar ou excluir com motivo</text><text class="p" x="970" y="221">Falhas duras não são liberadas</text><path class="line" d="M890 190H950"/><rect class="card" x="660" y="320" width="230" height="110" rx="12"/><text class="h" x="680" y="355">Motor de rateio</text><text class="p" x="680" y="385">Somente sessões elegíveis</text><text class="p" x="680" y="406">Decimal → centavos → snapshot</text><path class="line" d="M775 245V320"/><path class="line" d="M1055 245V375H890"/><rect class="card" x="345" y="320" width="250" height="110" rx="12"/><text class="h" x="367" y="355">PostgreSQL</text><text class="p" x="367" y="385">Sessões, tarifas, faturas e auditoria</text><text class="p" x="367" y="406">SQLAlchemy + Alembic · transações</text><path class="line" d="M660 375H595"/><path class="line" d="M470 245V320"/><rect x="345" y="500" width="545" height="110" rx="12" fill="#173d36"/><text x="367" y="535" style="font: bold 18px Arial;fill:#e0f1df">Previsão de energia · pandas + scikit-learn</text><text x="367" y="565" style="font:13px Arial;fill:#b4d1b9">Histórico validado → Ridge / baseline semanal → consumo mensal</text><text x="367" y="588" style="font:13px Arial;fill:#b4d1b9">Holdout temporal de 14 dias · métricas visíveis no dashboard</text><path class="line" d="M470 430V500"/><rect x="950" y="500" width="210" height="110" rx="12" fill="none" stroke="#91a797" stroke-dasharray="6 5"/><text class="h" x="970" y="535">Integração futura</text><text class="p" x="970" y="565">GoodWe / SEMS / RFID</text><text class="p" x="970" y="588">Não conectada neste protótipo</text><text class="p" x="40" y="642">Alternativa local: SQLite com um worker. Nenhuma cobrança real ou controle elétrico é executado.</text></svg>
