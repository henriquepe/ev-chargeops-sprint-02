name: ev-chargeops-sprint02
services:
  db:
    image: ${DOCKER_LIBRARY:-docker.io/library}/postgres:17-alpine
    environment:
      POSTGRES_DB: chargeops
      POSTGRES_USER: chargeops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chargeops-local-demo}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chargeops -d chargeops"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build:
      context: .
      args:
        DOCKER_LIBRARY: ${DOCKER_LIBRARY:-docker.io/library}
    ports:
      - "127.0.0.1:${APP_PORT:-8766}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://chargeops:${POSTGRES_PASSWORD:-chargeops-local-demo}@db:5432/chargeops
    volumes:
      - modeldata:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 10
volumes:
  pgdata:
  modeldata:
